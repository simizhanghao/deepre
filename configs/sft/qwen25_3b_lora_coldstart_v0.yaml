### Phase 2D2 — Qwen2.5-3B-Instruct LoRA cold-start on ~3k ShareGPT
### Checkpoint/resume enabled: do NOT set overwrite_output_dir=true.
### Re-run the same command after interrupt → auto-resume latest checkpoint-*.

### model
model_name_or_path: /data1/hcc/.hf_home/Qwen2.5-3B-Instruct
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 32
lora_alpha: 64
lora_target: all

### dataset
dataset: eca_coldstart_v0_train
eval_dataset: eca_coldstart_v0_dev
template: qwen
cutoff_len: 4096
overwrite_cache: true
preprocessing_num_workers: 16

### output
output_dir: /data1/hcc/deepresearch/outputs/sft_qwen25_3b_lora_coldstart_v0
logging_steps: 10
save_steps: 50
save_total_limit: 5
plot_loss: true
overwrite_output_dir: false
save_only_model: false
report_to: tensorboard

### train
# batch=16 + cutoff=4096 OOMed on long samples (~22GiB spike).
# Keep effective global batch ≈ 64: 4/gpu × 4 accum × 4 GPUs.
per_device_train_batch_size: 8
gradient_accumulation_steps: 2
learning_rate: 1.0e-4
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
ddp_timeout: 180000000
seed: 42
resume_from_checkpoint: null

### eval
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 50
